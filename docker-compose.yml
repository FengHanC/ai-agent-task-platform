services:
  # PHP-FPM 8.3 应用服务
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: ai-platform-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ai-platform-network
    depends_on:
      - postgres
      - redis

  # Nginx Web 服务器
  webserver:
    image: nginx:alpine
    container_name: ai-platform-webserver
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ai-platform-network
    depends_on:
      - app

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ai_platform}
      POSTGRES_USER: ${DB_USERNAME:-ai_platform_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_platform_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ai_platform_user} -d ${DB_DATABASE:-ai_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    ports:
      - "6379:6379"
    networks:
      - ai-platform-network

  # Node.js 前端构建
  node:
    image: node:22-alpine
    container_name: ai-platform-node
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - ai-platform-network
    depends_on:
      - app

networks:
  ai-platform-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
